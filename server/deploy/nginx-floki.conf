# nginx site for the Floki sync server, next to other sites on the same VPS.
# Copy to /etc/nginx/sites-available/floki, link into sites-enabled, then run certbot for HTTPS.
server {
    listen 80;
    server_name api.example.com;

    # Workspace uploads can be large; matches the server's 20 MB body limit.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
