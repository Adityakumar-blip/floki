[package]
name = "floki"
version = "0.1.1"
edition = "2021"
description = "A fast, local-first API workbench built with Rust and GPUI"

[dependencies]
gpui-kit = "0.8.0"
# Syntax highlighting for JSON, HTML and JavaScript bodies; features unify with gpui-kit's copy.
gpui-component = { version = "0.8.0", features = ["tree-sitter", "tree-sitter-html", "tree-sitter-javascript", "tree-sitter-bash"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "deflate", "multipart"] }
futures = "0.3"
dirs = "6"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
# Digest and AWS Signature auth.
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# OpenAPI/RAML (YAML) and WSDL (XML) import.
serde_yaml = "0.9"
roxmltree = "0.21"
# PKCE verifier and state for Google sign-in.
getrandom = "0.3"

# gRPC: ring-only rustls (aws-lc-rs would clash with reqwest's ring provider) and webpki roots.
tonic = { version = "0.14", default-features = false, features = ["channel", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
http = "1"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", default-features = false, features = ["serde"] }
protox = "0.9"
tokio = { version = "1", features = ["rt", "net", "time"] }

# Window icon on X11; same major version GPUI uses, so no extra build.
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
# Embeds the app icon in the Windows .exe.
embed-resource = "3"

[dev-dependencies]
tonic = { version = "0.14", default-features = false, features = ["server", "router", "codegen"] }
tonic-reflection = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
