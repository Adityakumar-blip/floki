name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Baked into release builds as the default sync server; set it under Settings → Secrets and variables → Actions → Variables.
env:
  FLOKI_SERVER: ${{ vars.FLOKI_SERVER }}

jobs:
  windows:
    runs-on: windows-latest
    # Tests run on Linux only; a debug test build doubles the slow Windows compile.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$version assets\floki.iss
          Copy-Item target/release/floki-cli.exe dist/floki-cli-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Floki-windows-x64-setup
          path: |
            dist/Floki-windows-x64-setup.exe
            dist/floki-cli-windows-x64.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Floki-windows-x64-setup.exe
            dist/floki-cli-windows-x64.exe

  linux:
    runs-on: ubuntu-24.04
    # A hung test would otherwise run until GitHub's 6-hour limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/Floki/assets
          cp target/release/floki target/release/floki-cli scripts/install-linux.sh dist/Floki/
          cp -r assets/floki.svg assets/app-icon assets/fonts/OFL-*.txt dist/Floki/assets/
          mv dist/Floki/install-linux.sh dist/Floki/install.sh
          tar -C dist -czf dist/Floki-linux-x64.tar.gz Floki
          scripts/build-deb.sh ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}
          cp target/release/floki-cli dist/floki-cli-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: Floki-linux-x64
          path: |
            dist/Floki-linux-x64.tar.gz
            dist/Floki-linux-x64.deb
            dist/floki-cli-linux-x64
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Floki-linux-x64.tar.gz
            dist/Floki-linux-x64.deb
            dist/floki-cli-linux-x64

  macos:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      # Signing and notarization run only when these secrets exist; otherwise the app is ad-hoc signed.
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Import signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "MACOS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build and package
        run: scripts/build-macos.sh ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}
      - name: Notarize
        if: env.HAS_CERTIFICATE == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/Floki-macos-universal.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Floki-macos-universal.dmg
          # A bare binary can't carry a stapled ticket; macOS looks it up online instead.
          ditto -c -k dist/floki-cli-macos-universal "$RUNNER_TEMP/floki-cli.zip"
          xcrun notarytool submit "$RUNNER_TEMP/floki-cli.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
      - uses: actions/upload-artifact@v4
        with:
          name: Floki-macos-universal
          path: |
            dist/Floki-macos-universal.dmg
            dist/floki-cli-macos-universal
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Floki-macos-universal.dmg
            dist/floki-cli-macos-universal

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Debian 12's older glibc keeps the binary runnable on any current Linux server.
    container: rust:1-bookworm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: floki
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --locked
        env:
          TEST_DATABASE_URL: postgres://postgres:test@postgres:5432/floki
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/release
          cp target/release/floki-server deploy/floki-server.service deploy/nginx-floki.conf deploy/floki.env.example deploy/floki-update dist/release/
          strip dist/release/floki-server
          tar -C dist -czf dist/floki-server-linux-x64.tar.gz release
      - uses: actions/upload-artifact@v4
        with:
          name: floki-server-linux-x64
          path: server/dist/floki-server-linux-x64.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: server/dist/floki-server-linux-x64.tar.gz
