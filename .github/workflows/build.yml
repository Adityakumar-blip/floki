name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Baked into release builds as the default sync server; set it under Settings → Secrets and variables → Actions → Variables.
env:
  FLOKI_SERVER: ${{ vars.FLOKI_SERVER }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/Floki | Out-Null
          Copy-Item target/release/floki.exe dist/Floki/Floki.exe
          Copy-Item README.md, assets/fonts/OFL-*.txt dist/Floki/
          Compress-Archive dist/Floki dist/Floki-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Floki-windows-x64
          path: dist/Floki-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Floki-windows-x64.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/Floki
          cp target/release/floki README.md assets/floki.svg assets/app-icon/floki-256.png assets/fonts/OFL-*.txt dist/Floki/
          tar -C dist -czf dist/Floki-linux-x64.tar.gz Floki
      - uses: actions/upload-artifact@v4
        with:
          name: Floki-linux-x64
          path: dist/Floki-linux-x64.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Floki-linux-x64.tar.gz

  server:
    runs-on: ubuntu-24.04
    # Debian 12's older glibc keeps the binary runnable on any current Linux server.
    container: rust:1-bookworm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: floki
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --locked
        env:
          TEST_DATABASE_URL: postgres://postgres:test@postgres:5432/floki
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/release
          cp target/release/floki-server deploy/floki-server.service deploy/nginx-floki.conf deploy/floki.env.example deploy/floki-update dist/release/
          strip dist/release/floki-server
          tar -C dist -czf dist/floki-server-linux-x64.tar.gz release
      - uses: actions/upload-artifact@v4
        with:
          name: floki-server-linux-x64
          path: server/dist/floki-server-linux-x64.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: server/dist/floki-server-linux-x64.tar.gz
